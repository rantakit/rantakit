[package]
name = "rantakit"
version = "0.4.1"
description = "Free, open-source file toolkit that works offline"
authors = ["moez-rd"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/moez-rd/rantakit"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rantakit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Experimental learned paper finding and cleaning (rantakit-image `ml`).
ml = ["rantakit-tasks/ml"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
rantakit-tasks = { path = "../crates/rantakit-tasks" }
tauri-plugin-dialog = "2"
thiserror = "2"
serde_json = "1"

# "Versi baru": the update check and install on desktop. The APK only reads
# the latest version (apk_update.rs), so the plugin is desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Reading the files the pickers hand over as `content://` addresses, and
# saving Results to `Download/Rantakit/`. The storage permission is declared
# for Android 8 and 9 only; later versions save through MediaStore without it.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = { version = "30.2", default-features = false, features = ["legacy-storage-permission"] }
# "Versi baru" for the APK: is the latest release newer than this one?
semver = "1"

# The system share sheet ("Bagikan") on the Result page, and the rounded
# corners of the undecorated window.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_Shell",
] }
windows-collections = "0.3"
