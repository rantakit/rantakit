[package]
name = "rantakit-image"
version = "0.3.0"
description = "Image engine for Rantakit (JPG and PNG), no Tauri dependency"
authors = ["moez-rd"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/moez-rd/rantakit"
edition = "2024"

[dependencies]
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27", default-features = false }
rantakit-core = { path = "../rantakit-core" }
